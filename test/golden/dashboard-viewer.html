<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>zfswatcher</title>
		<link href="/zw/resources/bootstrap/css/bootstrap.min.css" rel="stylesheet">
		<link href="/zw/resources/zfswatcher.css" rel="stylesheet">
		<link href="/zw/resources/favicon.ico" rel="shortcut icon">
		
		<meta name="htmx-config" content='{"allowEval":false,"includeIndicatorStyles":false,"selfRequestsOnly":true}'>
		<script src="/zw/resources/htmx/htmx.min.js" defer></script>
		
	</head>

	<body>

	<nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4" data-bs-theme="dark">
		<div class="container-fluid">
			<a class="navbar-brand" href="/zw/">zfswatcher</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="main-nav">
				<ul class="navbar-nav me-auto mb-2 mb-md-0">
					<li class="nav-item">
						<a class="nav-link active" aria-current="page" href="/zw/">Dashboard</a></li>
					<li class="nav-item">
						<a class="nav-link" href="/zw/status/">Pool Status</a></li>
					<li class="nav-item">
						<a class="nav-link" href="/zw/enclosure/">Enclosure</a></li>
					<li class="nav-item">
						<a class="nav-link" href="/zw/statistics/">Statistics</a></li>
				</ul>
				<ul class="navbar-nav">
					<li class="nav-item">
						<a class="nav-link" href="/zw/about/">About</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<main class="container-fluid">
		


<h1 class="h3 mb-3">Dashboard</h1>

<div id="live" hx-get="/zw/?fragment=1" hx-trigger="every 10s" hx-swap="innerHTML">

	<dl class="row">
		<dt class="col-sm-3 col-lg-2">load averages</dt>
		<dd class="col-sm-9 col-lg-10">VOLATILE</dd>
		<dt class="col-sm-3 col-lg-2">system uptime</dt>
		<dd class="col-sm-9 col-lg-10">VOLATILE</dd>
		<dt class="col-sm-3 col-lg-2">zfswatcher uptime</dt>
		<dd class="col-sm-9 col-lg-10">VOLATILE</dd>
	</dl>
	
	<div class="table-responsive card-table">
		<table class="table table-hover">
			<thead>
				<tr>
					<th scope="col">Pool</th>
					<th scope="col">State</th>
					<th scope="col" class="num">Total</th>
					<th scope="col" class="num">Used</th>
					<th scope="col" class="num">%</th>
					<th scope="col" class="num">Avail</th>
					<th scope="col" class="num">%</th>
					<th scope="col"><span class="visually-hidden">Usage</span></th>
					<th scope="col" class="num">Logical Used</th>
					<th scope="col" class="num">Compression Ratio</th>
				</tr>
			</thead>
			<tbody>
				
				<tr>
					<td><a href="/zw/status/zfsw_mix">zfsw_mix</a></td>
					<td class="text-success">ONLINE</td>
					<td class="num">2G</td>
					<td class="num">1024M</td>
					<td class="num">50%</td>
					<td class="num">1024M</td>
					<td class="num">50%</td>
					<td class="dash-bar">
						<a href="/zw/usage/zfsw_mix" title="Show the datasets of zfsw_mix">
						<div class="progress" role="progressbar" aria-label="Used space of zfsw_mix" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
						
							<div class="progress-bar bg-info pct-50"></div>
							<div class="progress-bar bg-success-subtle pct-50"></div>
						
						</div>
						</a>
					</td>
					<td class="num">3G</td>
					<td class="num">1.50x</td>
				</tr>
				
			</tbody>
		</table>
	</div>
	

</div>

	</main>

	<script src="/zw/resources/bootstrap/js/bootstrap.bundle.min.js"></script>

	</body>
</html>
